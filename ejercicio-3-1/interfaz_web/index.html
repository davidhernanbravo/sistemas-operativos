    <body>
        <!-- 
        ==========================================================================
        ARCHIVO: interfaz_web/index.html
        DESCRIPCIÓN: Capa de Presentación (Vista). Interfaz gráfica para login 
        y registro de usuarios. Delegando toda la lógica pesada a cliente_api.js.
        ==========================================================================
        -->
        <div class="contenedor-central">
            <div class="tarjeta">
                <h2>Gestor de Inventario</h2>
                <p>Ingresá tus credenciales para continuar</p>

                <!-- Contenedor para mostrar alertas dinámicas desde JS -->
                <div id="caja-alerta" class="alerta oculto"></div>

                <form id="formulario-auth">
                    <div class="grupo-control">
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" required autocomplete="off">
                    </div>
                    
                    <div class="grupo-control">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" required>
                    </div>

                    <div class="grupo-botones">
                        <!-- El submit dispara el evento principal (Login) -->
                        <button type="submit" id="btn-login" class="btn btn-primario">Iniciar Sesión</button>
                        <!-- Type button evita que se envíe el formulario automáticamente (Registro) -->
                        <button type="button" id="btn-registro" class="btn btn-secundario">Registrar Nuevo</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Importamos la capa de servicios (nuestro intermediario AJAX) -->
        <script src="cliente_api.js"></script>

        <!-- Controlador de eventos de la vista -->
        <script>
            // Referencias al DOM (Elementos HTML)
            const formAuth = document.getElementById('formulario-auth');
            const inputUser = document.getElementById('username');
            const inputPass = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            const btnRegistro = document.getElementById('btn-registro');
            const cajaAlerta = document.getElementById('caja-alerta');

            // Función auxiliar para mostrar mensajes asertivos
            function mostrarMensaje(mensaje, tipo) {
                cajaAlerta.textContent = mensaje;
                cajaAlerta.className = `alerta alerta-${tipo}`; // Ej: alerta-error o alerta-exito
                cajaAlerta.style.display = 'block';
                
                // Oculta el mensaje a los 4 segundos
                setTimeout(() => cajaAlerta.style.display = 'none', 4000);
            }

            // =======================================================
            // EVENTO: Iniciar Sesión
            // =======================================================
            formAuth.addEventListener('submit', async (evento) => {
                evento.preventDefault(); // Evita la recarga por defecto del navegador

                const user = inputUser.value.trim();
                const pass = inputPass.value.trim();

                btnLogin.disabled = true;
                btnLogin.textContent = "Verificando...";

                // Llamada asíncrona a la API a través de nuestro cliente
                const respuesta = await ClienteAPI.iniciarSesion(user, pass);

                if (respuesta.status === "success") {
                    mostrarMensaje(respuesta.message, "exito");
                    // Transición a la vista principal si todo sale bien
                    setTimeout(() => window.location.href = "panel_inventario.html", 1000);
                } else {
                    mostrarMensaje(respuesta.message || "Fallo de comunicación.", "error");
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Iniciar Sesión";
                }
            });

            // =======================================================
            // EVENTO: Registrar Usuario
            // =======================================================
            btnRegistro.addEventListener('click', async () => {
                const user = inputUser.value.trim();
                const pass = inputPass.value.trim();

                if (!user || !pass) {
                    mostrarMensaje("Completá ambos campos para registrarte.", "error");
                    return;
                }

                btnRegistro.disabled = true;
                btnRegistro.textContent = "Procesando...";

                const respuesta = await ClienteAPI.registrarUsuario(user, pass);

                if (respuesta.status === "success") {
                    mostrarMensaje(respuesta.message + " Ahora podés iniciar sesión.", "exito");
                    inputPass.value = ""; // Vaciamos la clave por seguridad
                } else {
                    mostrarMensaje(respuesta.message || "No se pudo registrar.", "error");
                }

                btnRegistro.disabled = false;
                btnRegistro.textContent = "Registrar Nuevo";
            });
        </script>

                </form>
            </div>
        </div>

        <script src="cliente_api.js"></script>

        <!-- Controlador de eventos de la vista -->
        <script>
            // El evento DOMContentLoaded garantiza que el HTML ya se dibujó antes de buscar los IDs.
            // Además, aísla el scope: las constantes ahora son locales a esta función.
            document.addEventListener('DOMContentLoaded', () => {
                
                const formAuth = document.getElementById('formulario-auth');
                const inputUser = document.getElementById('username');
                const inputPass = document.getElementById('password');
                const btnLogin = document.getElementById('btn-login');
                const btnRegistro = document.getElementById('btn-registro');
                const cajaAlerta = document.getElementById('caja-alerta');

                // Función auxiliar para mostrar mensajes asertivos.
                function mostrarMensaje(mensaje, tipo) {
                    cajaAlerta.textContent = mensaje;
                    cajaAlerta.className = `alerta alerta-${tipo}`;
                    cajaAlerta.style.display = 'block';
                    
                    setTimeout(() => cajaAlerta.style.display = 'none', 4000);
                }

                // ========================
                //  EVENTO: Iniciar Sesión
                // ========================
                formAuth.addEventListener('submit', async (evento) => {
                    evento.preventDefault(); 

                    const user = inputUser.value.trim();
                    const pass = inputPass.value.trim();

                    btnLogin.disabled = true;
                    btnLogin.textContent = "Verificando...";

                    const respuesta = await ClienteAPI.iniciarSesion(user, pass);

                    if (respuesta.status === "success") {
                        mostrarMensaje(respuesta.message, "exito");
                        setTimeout(() => window.location.href = "panel_inventario.html", 1000);
                    } else {
                        mostrarMensaje(respuesta.message || "Fallo de comunicación.", "error");
                        btnLogin.disabled = false;
                        btnLogin.textContent = "Iniciar Sesión";
                    }
                });

                // ===========================
                //  EVENTO: Registrar Usuario
                // ===========================
                btnRegistro.addEventListener('click', async () => {
                    const user = inputUser.value.trim();
                    const pass = inputPass.value.trim();

                    if (!user || !pass) {
                        mostrarMensaje("Completá ambos campos para registrarte.", "error");
                        return;
                    }

                    btnRegistro.disabled = true;
                    btnRegistro.textContent = "Procesando...";

                    const respuesta = await ClienteAPI.registrarUsuario(user, pass);

                    if (respuesta.status === "success") {
                        mostrarMensaje(respuesta.message + " Ahora podés iniciar sesión.", "exito");
                        inputPass.value = ""; 
                    } else {
                        mostrarMensaje(respuesta.message || "No se pudo registrar.", "error");
                    }

                    btnRegistro.disabled = false;
                    btnRegistro.textContent = "Registrar Nuevo";
                });
            });
        </script>

    </body>
    
</html>
